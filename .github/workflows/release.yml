name: Release

on:
  push:
    branches: [main]
  # Rebuilds and attaches the packages of an existing release, for example after a failed run
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to build and attach (for example v0.2.0)
        required: true

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A token other than GITHUB_TOKEN lets CI run on the release pull request it opens
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build .deb (${{ matrix.arch }})
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    strategy:
      matrix:
        include:
          - arch: amd64
            # Pinned, like arm64: node-pty is compiled here and needs the runner's glibc
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-deb-${{ matrix.arch }}
          path: release/*.deb
          if-no-files-found: error

  # The Mac image, for people who install by hand; the app is signed ad hoc and does not update itself
  build-mac:
    name: Build .dmg (arm64)
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    # Apple Silicon: package-mac.mjs builds for the runner's own processor, and macos-latest is arm64;
    # a fixed image such as macos-14 stops running once GitHub retires it, as it did for 0.10.0
    runs-on: macos-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-mac-arm64
          path: release/*.dmg
          if-no-files-found: error

  # The Windows zip, which `npx @devcockpit/install` unpacks; unsigned and checked by its smoke run
  build-win:
    name: Build zip (Windows x64)
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:win -- --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-win-x64
          path: release/*.zip
          if-no-files-found: error

  # The .deb packages decide the release: a failed Mac or Windows build leaves the release without its package
  publish:
    name: Attach to the release
    needs: [release-please, build, build-mac, build-win]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          shopt -s nullglob
          sha256sum *.deb *.dmg *.zip > SHA256SUMS
      # Build provenance attestations need a public repository
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/dev-cockpit_*
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: gh release upload "$TAG" assets/* --clobber --repo "$REPOSITORY"

  # The npm installer (D76), once the release has its packages: skipped until the repository variable
  # NPM_PUBLISH is 'true'. npm trusted publishing signs in with this job's OIDC token, so no npm token is stored
  publish-npm:
    name: Publish the npm installer
    needs: [release-please, publish]
    if: ${{ always() && vars.NPM_PUBLISH == 'true' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install --global npm@^11.5.1
      # pnpm pack builds the bundle (prepack) and writes the workspace versions out of package.json
      - name: Pack
        working-directory: packages/install
        run: pnpm pack
      # A rerun for a release already on npm has nothing to publish
      - name: Publish
        working-directory: packages/install
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@devcockpit/install@$version" version > /dev/null 2>&1; then
            echo "@devcockpit/install@$version is already on npm"
            exit 0
          fi
          npm publish "devcockpit-install-$version.tgz" --provenance --access public
