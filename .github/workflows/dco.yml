name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the sign-off of each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Bots cannot sign off. Only branches of this repository are trusted, because a fork can name its commits anything
          if [ "$HEAD_REPO" = "$REPOSITORY" ]; then
            case "$HEAD_REF" in
              release-please--* | dependabot/*)
                echo "Bot branch of this repository, nothing to sign off"
                exit 0
                ;;
            esac
          fi
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line. Amend it with 'git commit -s --amend' (or 'git rebase --signoff')."
              missing=1
            fi
          done
          exit $missing
