name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Saved so the restore step can give the runner its keychains back, even on a failure
      - name: Save the keychain search list (macOS)
        if: runner.os == 'macOS'
        run: |
          security list-keychains -d user > "$RUNNER_TEMP/dck-keychains.txt"
          security default-keychain -d user > "$RUNNER_TEMP/dck-default-keychain.txt"
      - name: Keychain integration test (macOS)
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/dck-test.keychain-db"
          security create-keychain -p dck-test "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p dck-test "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          DCK_KEYCHAIN_TEST=1 pnpm exec vitest run packages/adapters/macos-keychain
      - name: Restore the keychain search list (macOS)
        if: always() && runner.os == 'macOS'
        run: |
          set +e
          status=0
          # `security` prints each keychain as an indented, quoted path, one per line
          unquote() { sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//' "$1"; }
          saved="$RUNNER_TEMP/dck-keychains.txt"
          if [ -s "$saved" ]; then
            keychains=()
            while IFS= read -r entry; do
              [ -n "$entry" ] && keychains+=("$entry")
            done < <(unquote "$saved")
            security list-keychains -d user -s "${keychains[@]}" || status=1
          fi
          saved_default="$RUNNER_TEMP/dck-default-keychain.txt"
          if [ -s "$saved_default" ]; then
            security default-keychain -d user -s "$(unquote "$saved_default")" || status=1
          fi
          keychain="$RUNNER_TEMP/dck-test.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain" || status=1
          fi
          exit "$status"

  package:
    name: Package preview (.deb)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-cockpit-deb
          path: release/*.deb
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
