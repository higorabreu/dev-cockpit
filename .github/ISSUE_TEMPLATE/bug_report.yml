name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include private data (hosts, tokens, screenshots of private systems).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the cockpit with the hotkey
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dev Cockpit version
      description: From `dpkg -s dev-cockpit` or the name of the package you installed.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop environment
      placeholder: Ubuntu 24.04, GNOME 46 on X11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of the app or the daemon, if any. Remove tokens and private data first.
      render: shell
