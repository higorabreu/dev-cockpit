<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Dev Cockpit</title>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <div id="tabs" role="tablist" data-i18n-aria="a11y.tabs"></div>
        <div id="bar-end">
          <div id="notice" role="status"></div>
          <button id="tabs-new" type="button" data-i18n-aria="tabs.new" data-i18n-tip="tabs.new" data-tip-key="Ctrl+Shift+T">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="tabs-all" type="button" data-i18n-aria="tabs.all" data-i18n-tip="tabs.all" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
        </div>
      </div>
      <div id="main">
        <div id="host"></div>
        <div id="dock" data-open="false">
          <hr id="split" aria-orientation="vertical" data-i18n-aria="a11y.panelWidth" aria-valuemin="220" aria-valuemax="420" aria-valuenow="300" tabindex="0" />
          <aside id="panel" data-i18n-aria="a11y.panel"></aside>
          <nav id="rail" data-tip-side="left" data-i18n-aria="a11y.rail">
            <div id="rail-top">
              <button id="rail-panel" type="button" aria-controls="panel" aria-expanded="false" data-i18n-aria="panel.title" data-i18n-tip="panel.title" data-tip-key="Ctrl+Shift+B">
                <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/><rect class="pfill" x="15" y="4" width="6" height="16" fill="currentColor" stroke="none"/></svg>
              </button>
              <div id="rail-sections"></div>
            </div>
            <div id="rail-actions">
            <button id="rail-views" type="button" data-i18n-tip="views.open" data-tip-key="Ctrl+Shift+M">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M9 7.5V6a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 6v1.5M3 12.5h18"/></svg>
            </button>
            <button id="rail-settings" type="button" data-i18n-aria="settings.title" data-i18n-tip="settings.title" data-tip-key="Ctrl+,">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            </div>
          </nav>
        </div>
      </div>
      <div id="tab-menu" role="menu" hidden></div>
      <div id="search" role="dialog" data-i18n-aria="projects.search">
        <div id="search-box">
          <input id="search-input" type="text" data-i18n-placeholder="projects.search" autocomplete="off" spellcheck="false" data-i18n-aria="projects.search" />
          <div id="search-results" class="scroll" role="listbox"></div>
          <div id="search-hint" class="phint"></div>
        </div>
      </div>
      <div id="tab-list" role="dialog" data-i18n-aria="tabs.all" hidden></div>
      <div id="views" role="dialog"></div>
      <div id="settings" role="dialog" data-i18n-aria="settings.title">
        <div id="settings-box"><div id="settings-body"></div></div>
      </div>
      <div id="menu">
        <div id="menu-card" role="dialog" data-i18n-aria="a11y.menu"></div>
        <div id="menu-hint"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
