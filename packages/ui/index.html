<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Dev Cockpit</title>
  </head>
  <body>
    <div id="app">
      <div id="bar" role="tablist" aria-label="Abas"></div>
      <div id="main">
        <div id="host"></div>
        <aside id="panel" aria-label="Painel da sessão" hidden></aside>
      </div>
      <div id="notice" role="status"></div>
      <div id="tab-menu" role="menu" hidden></div>
      <div id="search" role="dialog" aria-label="Buscar projeto">
        <div id="search-box">
          <input id="search-input" type="text" placeholder="Buscar projeto" autocomplete="off" spellcheck="false" aria-label="Buscar projeto" />
          <div id="search-results" role="listbox"></div>
        </div>
      </div>
      <div id="menu">
        <div id="menu-card" role="dialog" aria-label="Menu de atalhos"></div>
        <div id="menu-hint"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
